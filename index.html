<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libreria dei Giochi da Tavolo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.5);
      --accent: #10b981;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .app-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 0 60px 0;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Filters */
    .filters-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .filters-grid {
        grid-template-columns: 2fr 1fr 1fr;
      }
    }

    .input-group {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      opacity: 0.6;
    }

    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      padding: 12px 14px 12px 40px;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s;
      appearance: none;
    }
    
    select {
      padding: 12px 14px;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 14px top 50%;
      background-size: 10px auto;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 10px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Game List */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 20px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .game-content {
      display: flex;
      gap: 20px;
    }

    .game-image-container {
      flex-shrink: 0;
      width: 140px;
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-image-container .empty-icon {
      margin-bottom: 0;
      font-size: 48px;
      opacity: 0.3;
    }

    .game-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-details {
      flex: 1;
      min-width: 0;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .tag {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .tag.mechanic {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .game-description {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .game-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .game-header {
        justify-content: center;
      }
      .game-stats {
        justify-content: center;
      }
      .game-tags {
        justify-content: center;
      }
      .game-image-container {
        width: 100%;
        max-width: 250px;
        height: 200px;
      }
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .game-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
    }

    .game-year {
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      margin-left: 12px;
    }

    .game-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .stat-icon {
      margin-right: 6px;
      opacity: 0.8;
    }

    .game-desc {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }
    
    .game-desc p {
      margin-bottom: 4px;
    }
    
    .game-desc strong {
      color: var(--text-main);
      font-weight: 500;
    }

    /* Expansions */
    .expansions {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .expansions-toggle {
      background: none;
      border: none;
      color: var(--primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: color 0.2s;
    }

    .expansions-toggle:hover {
      color: #60a5fa;
    }

    .expansions-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      animation: fadeIn 0.3s ease;
    }

    .expansions-list.active {
      display: flex;
    }

    .expansion-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .exp-name {
      font-weight: 500;
      color: #cbd5e1;
    }

    .exp-details {
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
      margin-left: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 20px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Collezione Giochi</h1>
      <p class="subtitle">Trova il gioco perfetto per la tua serata</p>
      
      <div class="filters-grid">
        <div class="input-group">
          <span class="input-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Cerca un gioco...">
        </div>
        
        <div class="input-group">
          <span class="input-icon">👥</span>
          <input type="number" id="players-input" min="1" max="99" placeholder="Giocatori">
        </div>
        
        <div class="input-group">
          <select id="time-select">
            <option value="">Durata (Tutte)</option>
            <option value="30">Veloce (≤ 30 min)</option>
            <option value="60">Medio (≤ 60 min)</option>
            <option value="120">Lungo (≤ 120 min)</option>
            <option value="999">Epico (> 120 min)</option>
          </select>
        </div>
      </div>
    </header>

    <div class="results-meta">
      <span id="results-count">0 giochi trovati</span>
    </div>

    <main class="games-list" id="games-container">
      <!-- Cards rendered via JS -->
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
